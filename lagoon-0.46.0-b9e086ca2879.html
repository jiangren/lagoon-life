<script>
window.LagoonFiles = {
 active:false,
 session:null,
 pendingVersion:'',
 updating:false,
 bindSession(callback) { this.session=callback; },
 gameActive(active) { this.active=active; if(!active){this.showPerformance(false);this.showTouch?.("","","");} if(active&&document.hidden) this.notify('hidden'); if(active&&this.pendingVersion)this.notify('update:'+this.pendingVersion); },
 notify(...args) { if(this.active&&this.session) this.session(...args); },
 async checkUpdate() {
  if(this.checking)return;
  this.checking=true;
  const controller=new AbortController();
  const timeout=setTimeout(()=>controller.abort(),5000);
  try {
   const response=await fetch('version.json',{cache:'no-store',signal:controller.signal});
   if(!response.ok)throw new Error('version unavailable');
   const data=await response.json();
   if(!/^\d+\.\d+\.\d+$/.test(data.version))throw new Error('invalid version');
   window.LagoonOffline?.checkUpdate();
   const remote=data.version.split('.').map(Number),local=BUILD_VERSION.split('.').map(Number);
   const differing=remote.findIndex((value,index)=>value!==local[index]);
   if(differing>=0&&remote[differing]>local[differing]){
    this.pendingVersion=data.version;
    const button=document.getElementById('update-available');button.hidden=false;button.textContent='新版本 '+data.version;
    this.notify('update:'+data.version);
   }else{this.pendingVersion='';document.getElementById('update-available').hidden=true;this.notify('up_to_date');}
  }catch(error){this.notify('update_failed');}
  finally{clearTimeout(timeout);this.checking=false;}
 },
 prepareUpdate() { this.updating=true; document.getElementById('display-feedback').textContent='正在保存并准备更新，请稍候…'; },
 showPerformance(show) { document.getElementById('performance-readout').hidden=!show; },
 reportPerformance(text) {
  const memory=performance.memory;
  document.getElementById('performance-readout').textContent=text+'\n'+(memory?'浏览器JS堆 '+(memory.usedJSHeapSize/1048576).toFixed(1)+'MiB（非总内存）':'此浏览器未提供JS堆内存统计');
 },
 dialog(title) {
  const dialog=document.createElement('dialog');
  dialog.style.cssText='box-sizing:border-box;width:min(660px,90vw);border:0;border-radius:18px;padding:28px;color:#264f48;background:#f8f7ee;font:18px sans-serif;';
  const heading=document.createElement('h2');heading.textContent=title;dialog.appendChild(heading);
  document.body.appendChild(dialog);dialog.showModal();
  const close=()=>{dialog.close();dialog.remove();document.getElementById('canvas').focus();};
  dialog.addEventListener('cancel',event=>{event.preventDefault();close();});
  return {dialog,close};
 },
 editName(value,callback) {
  const {dialog,close}=this.dialog('角色名字');
  const input=document.createElement('input');input.value=value;input.maxLength=12;input.setAttribute('aria-label','角色名字');
  input.style.cssText='box-sizing:border-box;width:100%;padding:12px;font-size:22px;';dialog.appendChild(input);
  const submit=document.createElement('button');submit.textContent='确认名字';submit.style.cssText='margin:20px 12px 0 0;padding:12px 24px;font-size:18px;';
  submit.onclick=()=>{const name=input.value.trim();if(name){close();callback(name);}};dialog.appendChild(submit);
  const cancel=document.createElement('button');cancel.textContent='取消';cancel.onclick=close;dialog.appendChild(cancel);
  input.addEventListener('keydown',event=>{if(event.key==='Enter'&&!event.isComposing){event.preventDefault();submit.click();}});input.focus();
 },
 pick(callback) {
  const {dialog,close}=this.dialog('导入海湾生活存档');
  const description=document.createElement('p');description.textContent='选择.json备份，或在下面粘贴存档文本。读取后仍需确认目标槽位。';dialog.appendChild(description);
  const input=document.createElement('input');input.type='file';input.accept='.json,application/json';input.setAttribute('aria-label','选择存档文件');dialog.appendChild(input);
  input.addEventListener('change',async()=>{try {
   const file=input.files[0];if(!file)return;
   if(file.size>32*1024*1024){close();callback('','备份超过32MB，请选择海湾生活存档。');return;}
   const text=await file.text();close();callback(text);
  }catch(error){close();callback('','文件读取失败，请重新选择。');}});
  const text=document.createElement('textarea');text.setAttribute('aria-label','存档JSON文本');text.placeholder='也可以粘贴完整存档JSON';
  text.style.cssText='box-sizing:border-box;display:block;width:100%;height:140px;margin-top:20px;font-size:16px;';dialog.appendChild(text);
  const submit=document.createElement('button');submit.textContent='读取粘贴的存档';submit.style.cssText='margin:20px 12px 0 0;padding:12px;font-size:18px;';
  submit.onclick=()=>{if(text.value.length>32*1024*1024){close();callback('','存档超过32MB。');return;}const value=text.value;close();callback(value);};dialog.appendChild(submit);
  const cancel=document.createElement('button');cancel.textContent='取消';cancel.onclick=close;dialog.appendChild(cancel);
 }
};
</script>

        <script>
        (()=>{
          const canvas=document.getElementById('canvas');
          const toggle=document.getElementById('fullscreen-toggle');
          const feedback=document.getElementById('display-feedback');
          const update=document.getElementById('update-available');
          const isToolbar = target => target instanceof Element && !!target.closest('#browser-tools button');
          let escapeUntil=0;
          window.addEventListener('blur',()=>LagoonFiles.notify('blur'));
          document.addEventListener('visibilitychange',()=>{if(document.hidden)LagoonFiles.notify('hidden');});
          canvas.addEventListener('pointerdown',()=>canvas.focus());
          canvas.addEventListener('wheel',event=>event.preventDefault(),{passive:false});
          canvas.addEventListener('contextmenu',event=>event.preventDefault());
          window.addEventListener('keyup',event=>{if(isToolbar(event.target))event.stopImmediatePropagation();},true);
          window.addEventListener('keydown',event=>{
            if(isToolbar(event.target)){event.stopImmediatePropagation();return;}
            const editing=event.target instanceof Element&&event.target.closest('input,textarea,select,[contenteditable="true"]');
            if(!editing&&event.key==='Escape'&&(document.fullscreenElement||performance.now()<escapeUntil)){
              event.stopImmediatePropagation(); return;
            }
            if(!editing&&document.activeElement===canvas&&!event.ctrlKey&&!event.metaKey&&!event.altKey&&['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Home'].includes(event.code))event.preventDefault();
          },true);
          document.getElementById('browser-tools').addEventListener('pointerdown',()=>LagoonFiles.notify('release'));
          update.addEventListener('click',()=>{
            LagoonFiles.notify('release');
            if(LagoonFiles.active)LagoonFiles.notify('open_update');
            else {LagoonFiles.prepareUpdate();engine.requestQuit();}
          });
          toggle.addEventListener('click',async()=>{
            LagoonFiles.notify('release');
            try {
              feedback.textContent='';
              if(document.fullscreenElement)await document.exitFullscreen();
              else await document.documentElement.requestFullscreen();
              canvas.focus();
            }catch(error){feedback.textContent='当前浏览器未允许全屏，可继续在窗口中游玩。';}
          });
          document.addEventListener('fullscreenchange',()=>{
            const full=!!document.fullscreenElement;
            toggle.textContent=full?'退出全屏':'全屏';
            toggle.setAttribute('aria-pressed',String(full));
            if(!full){escapeUntil=performance.now()+350;LagoonFiles.notify('fullscreen_exit');}
          });
          if(!document.fullscreenEnabled){toggle.disabled=true;toggle.textContent='全屏不可用';}
        })();
        </script>

const GODOT_THREADS_ENABLED = false;
const BUILD_VERSION = '0.46.0';
const engine = new Engine(GODOT_CONFIG);
// Normal engine exit completes its filesystem flush before asking for new HTML.
GODOT_CONFIG.onExit = code => {
 if(window.LagoonFiles.updating&&code===0)location.replace(new URL('index.html?v='+window.LagoonFiles.pendingVersion,location.href));
};

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');
	const statusCaption = document.getElementById('status-caption');
	const statusPercent = document.getElementById('status-percent');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		statusCaption.textContent = '暂时无法进入海湾';
		statusPercent.textContent = '';
		document.getElementById('status-hint').hidden = true;
		document.getElementById('status-retry').hidden = false;
		if (err instanceof Error) {
			setStatusNotice(/failed loading|failed to fetch|network/i.test(err.message)?'小镇资源没有下载完整。请检查网络，稍后点击“重新加载”。':err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	// Keep the crisp HTML cover until the game's first menu frame is drawn.
	window.LagoonFiles.ready = () => { setStatusMode('hidden'); window.LagoonOffline?.prepare(); };

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onExit': GODOT_CONFIG.onExit,
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
					statusPercent.textContent = Math.min(100, Math.floor(current / total * 100)) + '%';
				} else {
					statusPercent.textContent = '准备中';
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			window.LagoonFiles.checkUpdate();
			if (initializing) {
				statusCaption.textContent = '正在布置你的小镇';
				statusPercent.textContent = '即将抵达';
			}
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
